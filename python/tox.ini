[tox]
envlist = py310,py311,py312,py313,py314,format,lint
isolated_build = true

[testenv]
deps =
    pytest
    pytest-cov
    pytest-asyncio
    pytest-mock
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry install
commands =
    poetry run pytest {posargs}

[testenv:format]
deps =
    black
    isort
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry install
commands =
    poetry run black --check --diff .
    poetry run isort --check-only --diff .

[testenv:format-fix]
deps =
    black
    isort
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry install
commands =
    poetry run black .
    poetry run isort .

[testenv:lint]
deps =
    ruff
    mypy
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry install
commands =
    poetry run ruff check .
    poetry run mypy .

[testenv:lint-fix]
deps =
    ruff
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry install
commands =
    poetry run ruff check --fix .

[testenv:all]
deps =
    {[testenv]deps}
    {[testenv:format]deps}
    {[testenv:lint]deps}
commands =
    {[testenv:format]commands}
    {[testenv:lint]commands}
    {[testenv]commands}
