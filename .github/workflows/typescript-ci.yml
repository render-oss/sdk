name: TypeScript CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: ./typescript

jobs:
  changes:
    name: Determine if TypeScript files changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          filters: |
            typescript:
              - 'typescript/**'
              - '.github/workflows/typescript-ci.yml'

  lint-and-format:
    name: TypeScript Lint and Format Check
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npx biome ci --error-on-warnings

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Test Node ${{ matrix.node-version }}
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  bun-test:
    name: Test (Bun)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Run unit tests
        run: bun --bun run test

  e2e:
    name: TypeScript E2E Tests
    needs: [changes, lint-and-format, test]
    # Internal runner: api.staging.render.com is only reachable from inside the network.
    runs-on: arc-runner-2cpu
    timeout-minutes: 10
    environment:
      name: Staging
      deployment: false
    if: needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify e2e credentials are present
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_E2E_API_KEY }}
          RENDER_E2E_OWNER_ID: ${{ vars.RENDER_E2E_OWNER_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_E2E_OWNER_ID" ]; then
            echo "::error::e2e credentials are empty. The job is not wired to the Staging environment, or the secrets are missing. See SAN-374."
            exit 1
          fi

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_E2E_API_KEY }}
          RENDER_BASE_URL: ${{ vars.RENDER_E2E_BASE_URL }}
          RENDER_E2E_OWNER_ID: ${{ vars.RENDER_E2E_OWNER_ID }}
          RENDER_E2E_PAGINATION_OWNER_ID: ${{ vars.RENDER_E2E_PAGINATION_OWNER_ID }}
          RENDER_E2E_REGION: ${{ vars.RENDER_E2E_REGION }}

  # Fixed name so branch rules can require one check that survives matrix expansion and skips.
  required:
    name: TypeScript CI Required Checks
    needs: [changes, lint-and-format, test, bun-test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
