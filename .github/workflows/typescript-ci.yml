name: TypeScript CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: ./typescript

jobs:
  changes:
    name: Determine if TypeScript files changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          filters: |
            typescript:
              - 'typescript/**'
              - '.github/workflows/typescript-ci.yml'

  lint-and-format:
    name: TypeScript Lint and Format Check
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npx biome ci --error-on-warnings

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Test Node ${{ matrix.node-version }}
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  bun-test:
    name: Test (Bun)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Run unit tests
        run: bun --bun run test

  e2e:
    name: TypeScript E2E Tests
    needs: [changes, lint-and-format, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      needs.changes.outputs.typescript == 'true' &&
      (github.event_name == 'push' ||
       contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_E2E_API_KEY }}
          RENDER_BASE_URL: ${{ secrets.RENDER_E2E_BASE_URL }}
          RENDER_E2E_OWNER_ID: ${{ secrets.RENDER_E2E_OWNER_ID }}
          RENDER_E2E_PAGINATION_OWNER_ID: ${{ secrets.RENDER_E2E_PAGINATION_OWNER_ID }}
          RENDER_E2E_REGION: ${{ secrets.RENDER_E2E_REGION }}
