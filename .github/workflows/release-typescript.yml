name: Release TypeScript SDK

# Publishes @renderinc/sdk to npm when a new version reaches main in
# render-oss/sdk, then tags the release commit and creates the GitHub release.
# A version is new when it has no GitHub release yet.
#
# npm trusts this workflow through trusted publishing, so no npm token is
# stored, and npm adds a provenance attestation. Only the publish job can get
# an OIDC token, and it runs in the release environment, which requires
# approval.

on:
  push:
    branches: [main]
    paths:
      - typescript/package.json
  # Starts the release again, for example after a fix to this workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  plan:
    name: Find the release
    # renderinc/sdk has this workflow too, but only the public mirror
    # publishes, and only from main.
    if: github.repository == 'render-oss/sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.find.outputs.release }}
      tag: ${{ steps.find.outputs.tag }}
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # The history finds the commit that set the version.
          fetch-depth: 0
          persist-credentials: false

      - name: Find the version and its commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="$(node -p "require('./typescript/package.json').version")"
          tag="typescript/v$version"
          # Copybara can push more than one commit at a time, so the commit
          # that set the version can be before the head of main. Release that
          # commit, so that a later change does not go into this version.
          sha="$(git log -n 1 --format=%H -G '"version":' -- typescript/package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag has a GitHub release. Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # If the tag exists, gh release create ignores --target and
            # releases the commit of the tag. Stop if that is another commit.
            tag_sha="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
            if [[ -n "$tag_sha" && "$tag_sha" != "$sha" ]]; then
              echo "::error::$tag is on $tag_sha, not on $sha, the commit that set the version."
              exit 1
            fi
            echo "Releasing $tag from $sha."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # The release notes compare this version with the previous tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Write the release notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: .github/scripts/release-notes.sh "$TAG" > release-notes.md

      # npm trusted publishing needs npm 11.5.1 or later. Node.js 24.22.1
      # includes npm 11.19.1.
      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24.22.1
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: ./typescript
        run: npm ci

      - name: Test
        working-directory: ./typescript
        run: npm test

      - name: Build
        working-directory: ./typescript
        run: |
          set -o errexit -o nounset -o pipefail
          npm run build
          mkdir -p ../dist
          npm pack --pack-destination ../dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@renderinc/sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org

      # A re-run after a partial release skips a version that is already on
      # npm. The tarball path starts with ./ because npm reads dist/<name> as
      # a GitHub repository.
      - name: Publish
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="${TAG#typescript/v}"
          if npm view "@renderinc/sdk@$version" version > /dev/null 2>&1; then
            echo "@renderinc/sdk@$version is already on npm."
          else
            npm publish "./dist/renderinc-sdk-$version.tgz" --access public
          fi

  release:
    name: Create the GitHub release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release

      # Creates the tag on the commit that set the version.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "TypeScript SDK ${TAG#typescript/}" \
            --notes-file release-notes.md
