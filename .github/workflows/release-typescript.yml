name: Release TypeScript SDK

# Publishes @renderinc/sdk to npm when a typescript/vX.Y.Z tag is pushed to
# render-oss/sdk, then creates the GitHub release.
#
# npm trusts this workflow through trusted publishing, so no npm token is
# stored, and npm adds a provenance attestation. Only the publish job can get
# an OIDC token, and it runs in the release environment, which requires
# approval.

on:
  push:
    tags:
      - "typescript/v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build
    # renderinc/sdk has release tags too, but only the public mirror publishes.
    if: github.repository == 'render-oss/sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # The release notes compare this tag with the previous tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="${TAG#typescript/v}"
          found="$(node -p "require('./typescript/package.json').version")"
          if [[ "$found" != "$version" ]]; then
            echo "::error::typescript/package.json has version $found, but the tag is $TAG."
            exit 1
          fi

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/release-notes.sh "$TAG" > release-notes.md

      # npm trusted publishing needs npm 11.5.1 or later. Node.js 24.22.1
      # includes npm 11.19.1.
      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24.22.1
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: ./typescript
        run: npm ci

      - name: Test
        working-directory: ./typescript
        run: npm test

      - name: Build
        working-directory: ./typescript
        run: |
          set -o errexit -o nounset -o pipefail
          npm run build
          mkdir -p ../dist
          npm pack --pack-destination ../dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@renderinc/sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org

      # A re-run after a partial release skips a version that is already on
      # npm. The tarball path starts with ./ because npm reads dist/<name> as
      # a GitHub repository.
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="${TAG#typescript/v}"
          if npm view "@renderinc/sdk@$version" version > /dev/null 2>&1; then
            echo "@renderinc/sdk@$version is already on npm."
          else
            npm publish "./dist/renderinc-sdk-$version.tgz" --access public
          fi

  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TypeScript SDK ${TAG#typescript/}" \
            --notes-file release-notes.md
