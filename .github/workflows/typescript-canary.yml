name: TypeScript Canary Publish

on:
  pull_request:
    paths:
      - "typescript/**"
      - ".github/workflows/typescript-canary.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./typescript

jobs:
  publish:
    name: Publish PR canary
    if: >-
      github.repository == 'renderinc/sdk' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@renderinc"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Set canary version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('-')[0]")"
          SHORT_SHA="${HEAD_SHA::7}"
          CANARY_VERSION="${BASE_VERSION}-pr.${PR_NUMBER}.sha${SHORT_SHA}.run${RUN_NUMBER}.${RUN_ATTEMPT}"
          npm version "$CANARY_VERSION" --no-git-tag-version
          echo "CANARY_VERSION=$CANARY_VERSION" >> "$GITHUB_ENV"

      - name: Publish to GitHub Packages
        run: npm publish --tag "pr-${{ github.event.pull_request.number }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
