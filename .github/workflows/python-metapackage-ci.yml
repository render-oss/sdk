name: Python Metapackage CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

defaults:
  run:
    working-directory: ./python-metapackage

jobs:
  changes:
    name: Determine if Python metapackage files changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      metapackage: ${{ steps.filter.outputs.metapackage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # python/** is included because render_sdk/ is a generated mirror of
          # the SDK: any SDK change must re-run the drift check here.
          filters: |
            metapackage:
              - 'python-metapackage/**'
              - 'python/**'
              - '.github/workflows/python-metapackage-ci.yml'

  lint:
    name: Python Metapackage Lint
    needs: changes
    if: needs.changes.outputs.metapackage == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.13
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ./python-metapackage/.venv
        key: venv-metapackage-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync

    - name: Run format check with tox
      run: uv run tox -e format

    # Covers scripts/generate_mirror.py --check (mirror drift), mypy over
    # typing_tests/, mypy --strict over typing_tests/strict/, and ruff.
    - name: Run linting with tox
      run: uv run tox -e lint

  test:
    name: Test Python Metapackage ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.metapackage == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ./python-metapackage/.venv
        key: venv-metapackage-${{ github.repository }}-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync

    - name: Run tests with tox
      run: uv run tox -e py$(echo ${{ matrix.python-version }} | tr -d '.')

  # Fixed name so branch rules can require one check that survives matrix expansion and skips.
  required:
    name: Python Metapackage CI Required Checks
    needs: [changes, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
