name: Python CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

defaults:
  run:
    working-directory: ./python

jobs:
  changes:
    name: Determine if Python files changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            python:
              - 'python/**'
              - '.github/workflows/python-ci.yml'

  lint-and-format:
    name: Python Lint and Format Check
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.13
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ./python/.venv
        key: venv-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync

    - name: Run formatting check with tox
      run: uv run tox -e format

    - name: Run linting with tox
      run: uv run tox -e lint

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ./python/.venv
        key: venv-${{ github.repository }}-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync

    - name: Run tests with tox
      run: uv run tox -e py$(echo ${{ matrix.python-version }} | tr -d '.')

  e2e:
    name: Python E2E Tests
    needs: [changes, lint-and-format, test]
    # Internal runner: api.staging.render.com is only reachable from inside the network.
    runs-on: arc-runner-2cpu
    timeout-minutes: 10
    environment:
      name: Staging
      deployment: false
    if: needs.changes.outputs.python == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        python-version: '3.13'

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ./python/.venv
        key: venv-${{ github.repository }}-${{ runner.os }}-3.13-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync

    - name: Verify e2e credentials are present
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_E2E_API_KEY }}
        RENDER_E2E_OWNER_ID: ${{ vars.RENDER_E2E_OWNER_ID }}
      run: |
        if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_E2E_OWNER_ID" ]; then
          echo "::error::e2e credentials are empty. The job is not wired to the Staging environment, or the secrets are missing. See SAN-374."
          exit 1
        fi

    - name: Run E2E tests
      run: uv run pytest -m "e2e and not sandbox_e2e" -v
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_E2E_API_KEY }}
        RENDER_BASE_URL: ${{ vars.RENDER_E2E_BASE_URL }}
        RENDER_E2E_OWNER_ID: ${{ vars.RENDER_E2E_OWNER_ID }}
        RENDER_E2E_PAGINATION_OWNER_ID: ${{ vars.RENDER_E2E_PAGINATION_OWNER_ID }}
        RENDER_E2E_REGION: ${{ vars.RENDER_E2E_REGION }}

  # Split out so a missing renderd fleet reports on its own check instead of
  # gating everything else. Deliberately absent from the required checks
  # aggregate below, so it is visible without blocking merges.
  sandbox-e2e:
    name: Python Sandbox E2E Tests
    needs: [changes, lint-and-format, test]
    # Internal runner: api.staging.render.com is only reachable from inside the network.
    runs-on: arc-runner-2cpu
    timeout-minutes: 10
    environment:
      name: Staging
      deployment: false
    if: needs.changes.outputs.python == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        python-version: '3.13'

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ./python/.venv
        key: venv-${{ github.repository }}-${{ runner.os }}-3.13-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync

    - name: Verify e2e credentials are present
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_E2E_API_KEY }}
        RENDER_E2E_OWNER_ID: ${{ vars.RENDER_E2E_OWNER_ID }}
      run: |
        if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_E2E_OWNER_ID" ]; then
          echo "::error::e2e credentials are empty. The job is not wired to the Staging environment, or the secrets are missing. See SAN-374."
          exit 1
        fi

    - name: Run sandbox E2E tests
      run: uv run pytest -m "e2e and sandbox_e2e" -v
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_E2E_API_KEY }}
        RENDER_BASE_URL: ${{ vars.RENDER_E2E_BASE_URL }}
        RENDER_E2E_OWNER_ID: ${{ vars.RENDER_E2E_OWNER_ID }}
        RENDER_E2E_REGION: ${{ vars.RENDER_E2E_REGION }}

  # Fixed name so branch rules can require one check that survives matrix expansion and skips.
  required:
    name: Python CI Required Checks
    needs: [changes, lint-and-format, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
