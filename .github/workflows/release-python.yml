name: Release Python SDK

# Publishes render and render_sdk to PyPI when a new version reaches main in
# render-oss/sdk, then tags the release commit and creates the GitHub release.
# A version is new when it has no GitHub release yet.
#
# PyPI trusts this workflow through trusted publishing, so no PyPI token is
# stored. Only the publish job can get an OIDC token, and it runs in the
# release environment, which requires approval.

on:
  push:
    branches: [main]
    paths:
      - python/pyproject.toml
  # Starts the release again, for example after a fix to this workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  plan:
    name: Find the release
    # renderinc/sdk has this workflow too, but only the public mirror
    # publishes, and only from main.
    if: github.repository == 'render-oss/sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.find.outputs.release }}
      tag: ${{ steps.find.outputs.tag }}
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # The history finds the commit that set the version.
          fetch-depth: 0
          persist-credentials: false

      - name: Find the version and its commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' python/pyproject.toml)"
          tag="python/v$version"
          # Copybara can push more than one commit at a time, so the commit
          # that set the version can be before the head of main. Release that
          # commit, so that a later change does not go into this version.
          sha="$(git log -n 1 --format=%H -G '^version = ' -- python/pyproject.toml)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag has a GitHub release. Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # If the tag exists, gh release create ignores --target and
            # releases the commit of the tag. Stop if that is another commit.
            tag_sha="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
            if [[ -n "$tag_sha" && "$tag_sha" != "$sha" ]]; then
              echo "::error::$tag is on $tag_sha, not on $sha, the commit that set the version."
              exit 1
            fi
            echo "Releasing $tag from $sha."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # The release notes compare this version with the previous tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Check that both packages have the version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="${TAG#python/v}"
          for file in python/pyproject.toml python-metapackage/pyproject.toml; do
            found="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$file")"
            if [[ "$found" != "$version" ]]; then
              echo "::error::$file has version $found, but the release is $TAG."
              exit 1
            fi
          done

      - name: Write the release notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: .github/scripts/release-notes.sh "$TAG" > release-notes.md

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Test render
        working-directory: ./python
        run: uv run pytest -m "not e2e"

      - name: Test render_sdk
        working-directory: ./python-metapackage
        run: uv run pytest

      - name: Build
        run: |
          set -o errexit -o nounset -o pipefail
          (cd python && uv build --no-sources --out-dir ../dist/render)
          (cd python-metapackage && uv build --no-sources --out-dir ../dist/render-sdk)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/render/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release

      # render_sdk requires render==X.Y.Z, so render goes first. skip-existing
      # lets a re-run continue after a partial publish.
      - name: Publish render
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/render/
          skip-existing: true

      - name: Publish render_sdk
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/render-sdk/
          skip-existing: true

  release:
    name: Create the GitHub release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release

      # Creates the tag on the commit that set the version.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Python SDK ${TAG#python/}" \
            --notes-file release-notes.md
