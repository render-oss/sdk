---
openapi: 3.0.0
info:
  title: User API
  version: 1.0.0
paths:
  /start:
    post:
      summary: Start a task
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
      responses:
        '202':
          description: Task started
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /continue:
    post:
      summary: Continue a task
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinueRequest'
      responses:
        '200':
          description: Task continued
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Task not found
        '500':
          description: Internal server error
  /cancel:
    post:
      summary: Cancel a task
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Task canceled
        '400':
          description: Bad request
  /tasks:
    get:
      summary: Get all defined tasks
      responses:
        '200':
          description: All defined tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tasks'
        '500':
          description: Internal server error
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
components:
  schemas:
    StartRequest:
      type: object
      properties:
        name:
          type: string
        input: {}
        response_url:
          type: string
        task_run_id:
          type: string
      required:
      - name
      - input
      - response_url
      - task_run_id
    CancelRequest:
      type: object
      properties:
        task_run_id:
          type: string
      required:
      - task_run_id
    ContinueRequest:
      type: object
      properties:
        name:
          type: string
        input: {}
        task_run_id:
          type: string
        response_url:
          type: string
      required:
      - name
      - input
      - task_run_id
      - response_url
    Tasks:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      required:
      - tasks
    Task:
      type: object
      properties:
        name:
          type: string
        options:
          $ref: '#/components/schemas/TaskOptions'
        parameters:
          type: array
          description: Parameter schema extracted from the task function signature
          items:
            $ref: '#/components/schemas/TaskParameter'
      required:
      - name
    TaskOptions:
      type: object
      properties:
        retry:
          $ref: '#/components/schemas/RetryConfig'
        timeout_seconds:
          type: integer
          format: int64
          description: Task execution timeout in seconds (30-86400)
        plan:
          type: string
          description: Resource plan for task execution (starter=0.5CPU/512MB, standard=1CPU/2GB, pro=2CPU/4GB)
    RetryConfig:
      type: object
      properties:
        max_retries:
          type: integer
          description: Maximum number of retry attempts
        wait_duration_ms:
          type: integer
          format: int64
          description: Initial wait duration between retries (in milliseconds)
        factor:
          type: number
          description: Backoff factor for exponential retry
    TaskParameter:
      type: object
      description: Information about a task parameter extracted from function signature
      properties:
        name:
          type: string
          description: Parameter name
        type:
          type: string
          description: String representation of the parameter type hint
        has_default:
          type: boolean
          description: Whether the parameter has a default value
        default_value:
          type: string
          description: JSON-encoded default value (if has_default is true)
      required:
      - name
      - has_default
