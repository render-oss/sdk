[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "render_sdk"
# Version and the render==X.Y.Z pins are kept in sync with ../python by
# scripts/generate_mirror.py; edit the SDK version and regenerate.
version = "1.0.1"
description = "Compatibility shim for the renamed 'render' package. Install 'render' instead."
authors = [{ name = "Render", email = "support@render.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["render==1.0.1"]

[project.optional-dependencies]
key_value = ["render[key_value]==1.0.1"]

# No [project.scripts]: the render-workflows entry point is owned by the
# `render` distribution and installed transitively. Re-declaring it here would
# make both dists' RECORDs own the script, so uninstalling render_sdk (the
# expected migration endpoint) would delete it out from under `render`.

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "mypy>=1.18.2,<2",
  "tox>=4.0,<5",
  "ruff>=0.13,<0.14",
]

[tool.uv]
exclude-newer = "1 week"

# Dev/test must never resolve `render` from PyPI (the name currently hosts an
# unrelated 2015 package). Ignored by pip and by index consumers of the wheel.
[tool.uv.sources]
render = { path = "../python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["render_sdk"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
namespace_packages = true

# typing_tests/ is checked, never executed: mypy failing is the test failing.
# warn_unused_ignores turns each `# type: ignore` there into an assertion that
# the call it marks is genuinely rejected.
[[tool.mypy.overrides]]
module = "typing_tests.*"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py310"
# render_sdk/ is generated by scripts/generate_mirror.py.
exclude = ["render_sdk/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["E501"]
per-file-ignores = { "*test_*.py" = ["S101", "S106"] }
