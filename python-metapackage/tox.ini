[tox]
envlist = py310,py311,py312,py313,py314,format,lint
isolated_build = true

[testenv]
skip_install = true
allowlist_externals = uv
# Each version env gets its own uv environment built on the env's interpreter;
# without this, uv sync/run always target the shared .venv and every pyXY env
# silently tests the same Python. --reinstall-package forces fresh wheel
# builds of both dists (uv's cache keys don't cover source-file changes, so a
# stale cached wheel could otherwise be what gets tested).
setenv =
    UV_PROJECT_ENVIRONMENT = {env_dir}{/}uv
commands_pre =
    uv sync --no-editable --python {env_python} \
        --reinstall-package render --reinstall-package render_sdk
commands =
    uv run --no-editable --python {env_python} pytest {posargs}

[testenv:format]
skip_install = true
allowlist_externals = uv
commands_pre =
    uv sync
commands =
    uv run ruff format --check .

[testenv:format-fix]
skip_install = true
allowlist_externals = uv
commands_pre =
    uv sync
commands =
    uv run ruff format .

[testenv:lint]
skip_install = true
allowlist_externals = uv
commands_pre =
    uv sync
commands =
    uv run ruff check .
    uv run python scripts/generate_mirror.py --check
    uv run mypy typing_tests
    uv run mypy --strict typing_tests/strict

[testenv:lint-fix]
skip_install = true
allowlist_externals = uv
commands_pre =
    uv sync
commands =
    uv run ruff check --fix .

[testenv:all]
commands =
    {[testenv:format]commands}
    {[testenv:lint]commands}
    {[testenv]commands}
